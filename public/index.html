<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Башня принцессы: лобби</title>
<style>
:root{--bg:#1b1030;--card:#2a1740;--ink:#fbe8d3;--dim:#b9a3cc;--rose:#ff9bb3;--ok:#7dff9a;--bad:#ff6b81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1030;--card:#2a1740;--ink:#fbe8d3;--dim:#b9a3cc}}
:root[data-theme="dark"]{--bg:#1b1030;--card:#2a1740;--ink:#fbe8d3;--dim:#b9a3cc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;padding:20px}
main{max-width:720px;margin:0 auto}
h1{font-style:italic;color:var(--rose);font-size:30px;margin:0 0 4px}
h2{font-size:17px;font-style:italic;color:var(--rose);margin:0 0 8px}
p{color:var(--dim);margin:4px 0 10px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:14px 0}
input,button{font:inherit;border-radius:10px;border:0;padding:10px 14px}
input{background:#1b1030;color:var(--ink);width:100%;margin:4px 0 10px}
button{background:var(--rose);color:#2a1235;cursor:pointer;margin:4px 8px 4px 0}
button.sec{background:#3c2458;color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.col{display:flex;align-items:center;gap:8px;text-align:left;background:#1b1030;color:var(--ink);margin:0;padding:8px 10px}
.col.me{outline:2px solid #fff}.col small{color:var(--dim);display:block;line-height:1.1}
.dot{width:18px;height:18px;border-radius:50%;flex:none}
.row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #ffffff14}
.row .ok{margin-left:auto;color:var(--ok)}
#status{color:var(--dim);font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Башня принцессы</h1>
<p id="status">Подключаемся к серверу… (первый раз бесплатный сервер просыпается до минуты)</p>

<div id="join-view" class="card">
  <h2>Вход</h2>
  <label>Ваше имя<input id="name" maxlength="20" placeholder="например, Аня"></label>
  <div id="host-box"><button id="create" disabled>Создать комнату (я хост)</button></div>
  <label>Код комнаты<input id="room" maxlength="8" style="text-transform:uppercase" placeholder="если вас пригласили"></label>
  <button id="join" class="sec" disabled>Войти в комнату</button>
  <div id="err" style="color:var(--bad)"></div>
</div>

<div id="lobby-view" class="card hide">
  <h2>Комната <span id="code"></span></h2>
  <button id="link" class="sec">Скопировать ссылку для коллег</button>
  <h2 style="margin-top:10px">Игроки (<span id="count">0</span>)</h2>
  <div id="players"></div>
  <h2 style="margin-top:14px">Выберите дракона</h2>
  <div id="colors" class="grid"></div>
  <div style="margin-top:14px"><button id="ready">Я готов</button><button id="start" class="hide">Начать игру</button> <span id="hint" style="color:var(--dim)"></span></div>
  <div id="err2" style="color:var(--bad)"></div>
</div>

<div id="start-view" class="card hide"><h2>Игра начинается!</h2><p>Лобби работает. Сама игра подключится на следующем этапе.</p><div id="final"></div></div>
</main>
<script src="shared.js"></script>
<script>
const $=s=>document.querySelector(s);
let ws=null,me=null,players=[],room='',ready=false;
const qs=new URLSearchParams(location.search);
$('#room').value=(qs.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
$('#name').value=localStorage.getItem('ptw-name')||'';
if($('#room').value){$('#host-box').classList.add('hide')}   // пришли по ссылке: создавать комнату не нужно

function connect(){
  const t0=performance.now();
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>{$('#status').textContent='Подключились к серверу.';$('#create').disabled=false;$('#join').disabled=false};
  ws.onmessage=e=>onMsg(JSON.parse(e.data));
  ws.onclose=()=>{$('#status').textContent='Соединение потеряно. Обновите страницу.';$('#create').disabled=$('#join').disabled=true};
}
function enter(create){
  const name=$('#name').value.trim()||'Игрок';localStorage.setItem('ptw-name',name);
  room=create?Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[b%31]).join(''):$('#room').value.trim();
  $('#err').textContent='';
  ws.send(JSON.stringify({t:'join',room,name,create}));
}
$('#create').onclick=()=>enter(true);
$('#join').onclick=()=>enter(false);
$('#ready').onclick=()=>{ready=!ready;ws.send(JSON.stringify({t:'ready',ready}))};
$('#start').onclick=()=>ws.send(JSON.stringify({t:'start'}));
$('#link').onclick=()=>{const u=location.origin+'/?room='+me.room;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>$('#hint').textContent='Ссылка скопирована',()=>prompt('Скопируйте ссылку:',u));else prompt('Скопируйте ссылку:',u)};

function onMsg(m){
  if(m.t==='joined'){me=m;players=m.players;$('#join-view').classList.add('hide');$('#lobby-view').classList.remove('hide');$('#code').textContent=m.room;$('#start').classList.toggle('hide',!m.host);render()}
  else if(m.t==='players'){players=m.players;render()}
  else if(m.t==='error'){($('#lobby-view').classList.contains('hide')?$('#err'):$('#err2')).textContent=m.msg}
  else if(m.t==='host_left'){alert('Хост вышел, комната закрыта.');location.href=location.pathname}
  else if(m.t==='started'){sessionStorage.setItem('ptw-lobby',JSON.stringify({me,players:m.players}));
    $('#lobby-view').classList.add('hide');$('#start-view').classList.remove('hide');
    $('#final').innerHTML=m.players.map(p=>'<div class="row"><span class="dot" style="background:'+COLORS[p.color][1]+'"></span>'+esc(p.name)+' — '+COLORS[p.color][0]+'</div>').join('')}
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  $('#count').textContent=players.length;
  $('#players').innerHTML=players.map(p=>'<div class="row"><span class="dot" style="background:'+COLORS[p.color][1]+'"></span>'+esc(p.name)+(p.host?' (хост)':'')+(p.id===me.id?' (вы)':'')+'<span class="ok">'+(p.ready||p.host?'✓':'')+'</span></div>').join('');
  $('#colors').innerHTML='';
  COLORS.forEach(([name,col],i)=>{
    const owner=players.find(p=>p.color===i),mine=owner&&owner.id===me.id;
    const b=document.createElement('button');b.className='col'+(mine?' me':'');b.disabled=!!owner&&!mine;
    b.innerHTML='<span class="dot" style="background:'+col+'"></span><span>'+name+(owner&&!mine?'<small>'+esc(owner.name)+'</small>':'')+'</span>';
    b.onclick=()=>ws.send(JSON.stringify({t:'pick',color:i}));$('#colors').appendChild(b)});
  const me2=players.find(p=>p.id===me.id);ready=!!(me2&&me2.ready);
  $('#ready').textContent=ready?'Я не готов':'Я готов';$('#ready').classList.toggle('hide',me.host);
  const guests=players.filter(p=>!p.host),n=guests.filter(p=>p.ready).length;
  $('#start').disabled=n<guests.length;
  $('#hint').textContent=me.host?'Готовы '+n+' из '+guests.length:'';
  $('#err2').textContent='';
}
connect();
</script>
</body>
</html>
